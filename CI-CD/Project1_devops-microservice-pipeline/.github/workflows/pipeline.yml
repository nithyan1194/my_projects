name: Build, Test, and Containerize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # This enables the manual "Run workflow" button
  workflow_dispatch: 

jobs:
  # JOB 1: Continuous Integration (Test)
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest

  # JOB 2: Build & Package (Continuous Delivery)
  build-and-package:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker Image Locally (Validation)
        run: |
          docker build -t devops-flask-app:${{ github.sha }} .
          echo "Docker image built successfully with tag ${{ github.sha }}"
